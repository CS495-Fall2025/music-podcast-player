[project]
name = "rss-music-remote-set-admin"
version = "0.1.0"
requires-python = ">=3.12,<4.0"
dependencies = [
	"boto3>=1.42,<2.0",
]


[project.scripts]
setadmin = "setadmin.cli:main"


[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
where = ["src"]
