name: Backend Check Linting (Ruff)

on:
  pull_request:
    branches:
      - main

jobs:
  backend-check-linting:
    runs-on: ubuntu-latest
    container:
      image: python:3.13-alpine
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v3
      - run: apt update
      - run: apt install -y gcc libpg-dev
      - run: pip install --root-user-action ignore -r dev-requirements.txt
      - run: python -m ruff check
