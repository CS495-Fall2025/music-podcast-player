name: Backend Run Tests (PyTest)

on:
  pull_request:
    branches:
      - main

jobs:
  backend-run-tests:
    runs-on: ubuntu-latest
    container:
      image: python:3.13-alpine
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v3
      - run: pip install --root-user-action ignore -r dev-requirements.txt 
      - run: python -m pytest
