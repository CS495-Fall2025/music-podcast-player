name: Backend Run Tests (PyTest)

on:
  pull_request:
    branches:
      - main

jobs:
  backend-run-tests:
    runs-on: ubuntu-latest
    container:
      image: python:3.13-alpine
    defaults:
      run:
        working-directory: backend
    env:
      ALLOWED_ORIGINS: http://localhost:5173
      PODCAST_INDEX_KEY: fake_key
      PODCAST_INDEX_SECRET: fake_secret
    steps:
      - uses: actions/checkout@v3
      - run: apt update
      - run: apt install -y gcc libpg-dev
      - run: pip install --root-user-action ignore -r dev-requirements.txt
      - run: pip install --root-user-action ignore -e .
      - run: python -m pytest
