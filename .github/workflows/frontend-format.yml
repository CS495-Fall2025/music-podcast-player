name: Frontend Check Format (Prettier)

on:
  pull_request:
    branches:
      - main

jobs:
  frontend-check-format:
    runs-on: ubuntu-latest
    container:
      image: node:24-alpine
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v3
        with:
          node-version: 24
      - run: npm install
      - run: npm run format-check
