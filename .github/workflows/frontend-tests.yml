name: Frontend Run Tests (Vitest)

on:
  pull_request:
    branches:
      - dev

jobs:
  frontend-run-tests:
    runs-on: ubuntu-latest
    container:
      image: node:24-alpine
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v3
        with:
          node-version: 24
      - run: npm install
      - run: npm test -- --run
