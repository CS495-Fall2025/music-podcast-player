name: Continuous Deployment Builds

on:
  workflow_call:

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    container:
      image: node:24-alpine
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v3
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: docker/setup-qemu-action@v3
      - run: python3 backend/build_backend_lambda.py
      - uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/lambda_build/backend_build.zip

