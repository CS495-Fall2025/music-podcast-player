name: Continuous Deployment Builds

#on:
#  workflow_call:

# Temporary until I've finished testing the actions.
on:
  pull_request:
    branches:
      - dev

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    container:
      image: node:24-alpine
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v3
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: ls -la /github/workspace #./.github/actions/build-backend
      - uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: build/backend-build.zip

