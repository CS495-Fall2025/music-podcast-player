name: Continuous Deployment Builds

on:
  workflow_call:

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    container:
      image: node:24-alpine
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v3
      - run: npm install
      - run: mv build.env .env
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.lambda
          cache-from: type=gha
          cache-to: type=gha
          platforms: linux/arm64
          tags: backend-build:latest
          load: true
      - run: docker run --rm -v ${{ github.workspace }}/build:/mnt/result --platform linux/arm64 backend-build:latest
      - uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: ${{ github.workspace }}/build/backend_build.zip

