name: Development Continuous Deployment Checks
description: Shows how the changes in a PR would affect the current deployment.

on:
  pull_request:
    branches:
      - dev

jobs:
  build:
    uses: ./.github/workflows/cd-builds.yml
  check-dev-stack-diff:
    runs-on: ubuntu-latest
    environment: development
    needs: build
    container:
      image: python:3.13-alpine
    defaults:
      run:
        working-directory: cdk
    env:
      FRONTEND_BUILD_PATH: "${{ github.workspace }}/builds/dist"
      BACKEND_BUILD_PATH: "${{ github.workspace }}/builds/backend_build.zip"
    steps:
      - uses: actions/checkout@v3
      - uses: actions/download-artifact@v5
        with:
          name: frontend-build
          path: builds/
      - uses: actions/download-artifact@v5
        with:
          name: backend-build
          path: builds/
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_FETCH_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: cdk diff
        working-directory: cdk
