services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    # Keeping node_modules in the container seperate.
    # Using ./frontend as a volume lets us update files on the fly and have the page
    # still autoupdate.
    volumes:
      - ./frontend:/app
      - /app/node_modules
  backend:
    build: ./backend
    ports:
      - "5000:5000"
  database:
    build: ./database
    ports:
      - "5432:5432"
    env_file:
      - ./database/.env
    volumes:
      - music_db_data:/var/lib/postgresql/data

volumes:
  music_db_data:
