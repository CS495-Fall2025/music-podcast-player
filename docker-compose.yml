services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    # Keeping node_modules in the container seperate.
    # Using ./frontend as a volume lets us update files on the fly and have the page
    # still autoupdate.
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    env_file: ./secrets/backend.env
    depends_on:
      - database
    command: sh -c "sleep 5 && alembic upgrade head && python3 -m flask run"
  database:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: dev-db-password
    # Necessary for updating DB schema with Alembic outside Docker.
    ports:
      - "5432:5432"