services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    # Keeping node_modules in the container seperate.
    # Using ./frontend as a volume lets us update files on the fly and have the page
    # still autoupdate.
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
  backend-api-service:
    build:
      context: ./backend/packages/
      dockerfile: ../docker/local_dev/Dockerfile.api-service
    ports:
      - "5000:5000"
    env_file: ./secrets/backend.env
    environment:
      RSS_PLAYER_ALLOWED_ORIGINS: http://localhost:5173
      RSS_PLAYER_DB_SERVICE_URL: http://backend-db-service:5001
      RSS_PLAYER_DYNAMODB_URL: http://dynamodb:8000
      RSS_PLAYER_ENVIRONMENT: dev
      RSS_PLAYER_SECRET_KEY: dev-secret-key-7Th41h!tDGU@vI1^8&9%
      RSS_PLAYER_API_TOKENS_PER_REFILL: >
        {
          "global": {"overall": 60, "podcast_index": 15},
          "public": {"overall": 60, "podcast_index": 15},
          "user": {"overall": 60, "podcast_index": 15}
        }
      RSS_PLAYER_TOKEN_REFILL_SECONDS: 60
      RSS_PLAYER_TOKEN_PENALTY: >
        {
          "podcast_index": 15
        }
      RSS_PLAYER_TOKEN_TABLE_NAME: RateLimitTokens
      RSS_PLAYER_DISABLE_EMAIL_VERIFY: true
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      RSS_PLAYER_CMS_BUCKET: rss-music-player-cms
      RSS_PLAYER_S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      database:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      dynamodb-tables:
        condition: service_completed_successfully
      page-initializer:
        condition: service_completed_successfully
  backend-db-service:
    build:
      context: ./backend/packages/
      dockerfile: ../docker/local_dev/Dockerfile.db-service
    environment:
      DATABASE_URL: postgresql://rssmusicplayerapp:dev-db-service-password@database:5432/postgres
    depends_on:
      migrations:
        condition: service_completed_successfully
  migrations:
    build:
      context: ./backend/packages/
      dockerfile: ../docker/local_dev/Dockerfile.migration-handler
    environment:
      DATABASE_URL: postgresql://postgres:dev-db-password@database:5432
      DB_SERVICE_ROLE_PASSWORD: dev-db-service-password
    depends_on:
      database:
        condition: service_healthy
  dynamodb-tables:
    build:
      context: ./backend/packages/
      dockerfile: ../docker/local_dev/Dockerfile.dynamodb-tables
    environment:
      DYNAMODB_URL: http://dynamodb:8000
      RSS_PLAYER_TOKEN_TABLE_NAME: RateLimitTokens
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      dynamodb:
        condition: service_healthy
  page-initializer:
    build:
      context: ./backend/packages/
      dockerfile: ../docker/local_dev/Dockerfile.page-initializer
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      RSS_PLAYER_CMS_BUCKET: rss-music-player-cms
      RSS_PLAYER_S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      minio-buckets:
        condition: service_completed_successfully
  database:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: dev-db-password
    # Necessary for updating DB schema with Alembic outside Docker.
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 5s
      retries: 15
  dynamodb:
    image: amazon/dynamodb-local:latest
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory" # allow minio to see credentials in DB.
    healthcheck:
      test: ["CMD-SHELL", "echo > /dev/tcp/localhost/8000"]
      interval: 1s
      timeout: 5s
      retries: 15
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 1s
      timeout: 5s
      retries: 15
  minio-buckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/rss-music-player-cms;
      exit 0;
      "
