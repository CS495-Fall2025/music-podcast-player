[project]
name = "rss-music-set-admin"
version = "0.1.0"
requires-python = ">=3.12,<4.0"
dependencies = [
	"psycopg2>=2.9,<3.0",
	"SQLAlchemy>=2.0,<3.0",
	"rss-music-data-model==0.1.0",
]


[project.optional-dependencies]
dev = [
	"pytest>=8.4,<9.0",
	"ruff>=0.13,<1.0",
]
local = [
	"python-dotenv>=1.2.2,<2.0",
]
lambda = [
	"boto3>=1.42,<2.0",
]


[project.scripts]
setadmin = "rss_music_set_admin.cli:main"


[dependency-groups]
dev = [
	"pytest>=8.4,<9.0",
	"ruff>=0.13,<1.0",
]
local = [
	"python-dotenv>=1.2.2,<2.0",
]
lambda = [
	"boto3>=1.42,<2.0",
]


[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]


[tool.uv.sources]
rss-music-data-model = { path = "../data_model" }
