[project]
name = "rss-music-db-service-schemas"
version = "0.1.0"
dependencies = [
	"marshmallow>=4.0,<5.0",
	"rss-music-common-validators==0.1.0",
]


[dependency-groups]
dev = [
	"pytest>=8.4,<9.0",
	"ruff>=0.13,<1.0",
]


[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
where = ["src"]


[tool.uv.sources]
rss-music-common-validators = { path = "../common_validators" }
