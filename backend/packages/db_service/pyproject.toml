[project]
name = "rss-music-db-service"
version = "0.1.0"
dependencies = [
	"fastapi>=0.128,<1.0",
	"marshmallow>=4.0,<5.0",
	"rss-music-data-model==0.1.0",
	"rss-music-db-service-schemas==0.1.0",
]


[dependency-groups]
dev = [
	"pytest>=8.4,<9.0",
	"ruff>=0.13,<1.0",
]
local = [
	"uvicorn>=0.40,<1.0",
]
lambda = [
	"boto3>=1.42,<2.0",
]


[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]


[tool.uv.sources]
rss-music-data-model = { path = "../data_model" }
rss-music-db-service-schemas = { path = "../db_service_schemas" }
