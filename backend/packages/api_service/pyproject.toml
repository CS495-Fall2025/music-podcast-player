[project]
name = "rss-music-api-service"
version = "0.1.0"
dependencies = [
	"flask>=3.1,<4.0",
	"flask-cors>=6.0,<7.0",
	"requests>=2.32,<3.0",
	"marshmallow>=4.0,<5.0",
	"marshmallow-dataclass>=8.7,<9.0",
	"PyJWT>=2.8.0,<3.0",
	"alembic>=1.13,<2.0", # migrations
	"psycopg2>=2.9,<3.0", # db
	"SQLAlchemy>=2.0,<3.0", # db
]


[project.optional-dependencies]
dev = [
	"pytest>=8.4,<9.0",
	"ruff>=0.13,<1.0",
]
lambda = [
	"aws-wsgi>=0.2,<1.0",
	"boto3>=1.42,<2.0",
]


[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]
