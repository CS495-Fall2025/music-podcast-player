[project]
name = "rss-music-api-service"
version = "0.1.0"
requires-python = ">=3.12,<4.0"
dependencies = [
	"flask>=3.1,<4.0",
	"flask-cors>=6.0,<7.0",
	"requests>=2.32,<3.0",
	"marshmallow>=4.0,<5.0",
	"marshmallow-dataclass>=8.7,<9.0",
	"PyJWT>=2.8.0,<3.0",
	"rss-music-common-validators==0.1.0",
	"rss-music-db-service-schemas==0.1.0",
]


[project.optional-dependencies]
dev = [
	"pytest>=8.4,<9.0",
	"ruff>=0.13,<1.0",
]
lambda = [
	"apig-wsgi>=2.20,<3.0",
	"boto3>=1.42,<2.0",
	"requests-aws4auth>=1.3,<2.0",
]


[dependency-groups]
dev = [
	"pytest>=8.4,<9.0",
	"ruff>=0.13,<1.0",
]
lambda = [
	"apig-wsgi>=2.20,<3.0",
	"boto3>=1.42,<2.0",
	"mangum>=0.21,<1.0",
	"requests-aws4auth>=1.3,<2.0",
]


[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]


[tool.uv.sources]
rss-music-common-validators = { path = "../common_validators" }
rss-music-db-service-schemas = { path = "../db_service_schemas" }
