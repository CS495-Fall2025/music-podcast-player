[project]
name = "rss-music-page-initializer"
version = "0.1.0"
requires-python = ">=3.12,<4.0"
dependencies = [
	"rss-music-editable-pages==0.1.0",
]


[project.optional-dependencies]
dev = [
	"ruff>=0.13,<1.0",
	"pytest>=8.4,<9.0",
]
lambda = []


[dependency-groups]
dev = [
	"ruff>=0.13,<1.0",
	"pytest>=8.4,<9.0",
]
lambda = []


[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
where = ["src"]


[tool.uv.sources]
rss-music-editable-pages = { path = "../editable_pages" }
