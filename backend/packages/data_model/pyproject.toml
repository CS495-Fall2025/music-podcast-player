[project]
name = "rss-music-data-model"
version = "0.1.0"
dependencies = [
	"psycopg2>=2.9,<3.0",
	"SQLAlchemy>=2.0,<3.0",
]


[dependency-groups]
dev = [
	"pytest>=8.4,<9.0",
	"ruff>=0.13,<1.0",
]


[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
where = ["src"]
